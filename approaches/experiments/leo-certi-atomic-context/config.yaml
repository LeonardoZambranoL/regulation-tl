team_id: "team-11"
experiment_name: "leo-certi-atomic-context"

models:
  stage1_product_reader: "claude-sonnet-5-5"
  stage2_regulation_gate: "claude-sonnet-5-5"
  stage3_extractor: "claude-sonnet-5-5"
  stage4_second_pass: "claude-sonnet-5-5"
  stage5_verifier: "claude-sonnet-5-5"
  eval_judge: "claude-sonnet-5-5"
  embedding_model: "gemini-embedding-2-preview"
  embedding_dim: 768

prompts:
  stage1_product_reader: "stage1_product_reader_v1.md"
  stage2_regulation_gate: "stage2_regulation_gate_v1.md"
  stage3_extractor: "stage3_atomic_context.md"
  stage4_second_pass: "stage3_atomic_context.md"
  stage5_verifier: "stage5_context_evidence.md"
  eval_judge: "eval_judge_v1.md"

retrieval:
  top_k_per_query: 30
  rrf_k0: 60
  bm25_k1: 1.2
  bm25_b: 0.75
  bm25_delta: 1.0
  bm25_bigrams: true
  use_dense_embeddings: false

gate:
  candidate_top_regs: 12
  score_floor: 0.15
  gate_confidence_floor: 0.65
  apply_supersession_filter: true
  apply_category_filter: true

extraction:
  batch_max_clauses: 8
  batch_max_chars: 14000
  workers: 2
  only_obligation_candidates_pass1: true
  run_second_pass: true
  verbatim_clause_text: false
  min_rating: 3
  keep_subjects: ["product", "product_installation", "whole_vehicle", "manufacturer_paperwork", "test_laboratory_logistics"]

verification:
  enabled: true
  batch_size: 8
  workers: 2
  drop_unsupported: true
  split_compound: true
  applicability_drop_confidence: 0.95
  dedup_similarity_threshold: 0.92
