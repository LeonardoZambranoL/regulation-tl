# On every push to main: rebuild the leaderboard and dashboard from approaches/leaderboard.json and the experiment
# folders, and commit them back when they changed. Nobody needs hooks or Claude for the repo copy to be current.
# The claude.ai dashboard is updated separately by Devansh's scheduled sync (see approaches/dashboard/README.md).
name: Rebuild dashboard

on:
  push:
    branches: [main]
    paths:
      - "approaches/leaderboard.json"
      - "approaches/experiments/**"
      - "approaches/benchmarking/**"
      - "approaches/dashboard/standalone_template.html"
      - "approaches/dashboard/explanations.json"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-dashboard
  cancel-in-progress: false

jobs:
  rebuild:
    # never react to this workflow's own commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Challenge repo (gold answers for the clause level)
        uses: actions/checkout@v4
        with:
          repository: Certivity/industrial-ai-hackathon
          path: _challenge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r approaches/benchmarking/requirements.txt
      - name: Rebuild LEADERBOARD.md, leaderboard_rows.json and dashboard.html
        run: |
          python - <<'EOF'
          import json, sys
          sys.path.insert(0, "approaches/benchmarking")
          import bench
          rows = json.load(open("approaches/leaderboard.json", encoding="utf-8"))
          open("approaches/LEADERBOARD.md", "w", encoding="utf-8").write(bench.render_leaderboard(rows))
          EOF
          golds=$(for f in _challenge/cases/*/expected.json; do printf -- '--gold %s ' "$f"; done)
          python approaches/benchmarking/dashboard_rows.py $golds
      - name: Commit if anything changed
        run: |
          git add approaches/LEADERBOARD.md approaches/dashboard/leaderboard_rows.json approaches/dashboard/dashboard.html
          if git diff --cached --quiet; then echo "dashboard already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild dashboard after ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push the rebuilt dashboard" >&2; exit 1
